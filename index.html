<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <!-- PWA Manifest and Icons -->
  <link rel="icon" type="image/png" href="/favicon.png" />
  <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
  <link rel="manifest" href="/manifest.json?v=1" />

  <!-- Apple Touch Icons for native app experience -->
  <link rel="apple-touch-icon" sizes="72x72" href="/icon-72x72.png" />
  <link rel="apple-touch-icon" sizes="96x96" href="/icon-96x96.png" />
  <link rel="apple-touch-icon" sizes="128x128" href="/icon-128x128.png" />
  <link rel="apple-touch-icon" sizes="144x144" href="/icon-144x144.png" />
  <link rel="apple-touch-icon" sizes="152x152" href="/icon-152x152.png" />
  <link rel="apple-touch-icon" sizes="192x192" href="/icon-192x192.png" />
  <link rel="apple-touch-icon" sizes="384x384" href="/icon-384x384.png" />
  <link rel="apple-touch-icon" sizes="512x512" href="/icon-512x512.png" />

  <!-- Apple Safari and PWA meta tags -->
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Noor Connect" />
  <meta name="application-name" content="Noor Connect" />
  <meta name="msapplication-TileColor" content="#000000" />
  <meta name="theme-color" content="#000000" />
  <!-- Content Security Policy: Self-contained for F-Droid -->
  <meta http-equiv="Content-Security-Policy"
    content="default-src 'self'; script-src 'self'; script-src-attr 'none'; worker-src 'self' blob:; style-src 'self' 'unsafe-inline'; font-src 'self' data:; img-src 'self' data: https: blob: http://localhost; connect-src 'self' https: wss: http: blob:; media-src 'self' https: blob: http:; frame-src 'self' https: blob:; object-src 'none'; base-uri 'self'; form-action 'self';" />
  <title>Noor Connect - Your Islamic Companion</title>
  <meta name="description"
    content="Noor Connect - Prayer times, Qur'an, Qibla, Tasbeeh, and Daily Hadith. Your complete Islamic companion app.">
  <meta name="author" content="Noor Connect" />

  <!-- Localized SEO and performance - No external CDNs for F-Droid compliance -->
  <link rel="dns-prefetch" href="https://api.aladhan.com">

  <!-- System Font Stack - No external font dependencies -->
  <style>
    /* Using CSS custom property for system font stack - no web font downloads */
    :root {
      --font-noor-main: 'ui-sans-serif', 'system-ui', '-apple-system', 'BlinkMacSystemFont', 'Segoe UI', 'Roboto', 'Helvetica Neue', 'Arial', 'Noto Sans', sans-serif;
    }
  </style>

  <!-- Open Graph / Twitter meta tags -->
  <meta property="og:type" content="website" />
  <meta property="og:title" content="Noor Connect - Your Islamic Companion">
  <meta property="og:description"
    content="Noor Connect - Prayer times, Qur'an, Qibla, Tasbeeh, and Daily Hadith. Your complete Islamic companion app.">
   <meta property="og:image"
      content="/qibla.png">
   <meta name="twitter:image"
      content="/qibla.png">

  <!-- Splash Screen CSS is handled inline by the React SplashScreen component -->

  <!-- Inline critical CSS for faster FCP -->
  <style>
    /* Critical CSS for initial render */
    body {
      font-family: 'ui-sans-serif', 'system-ui', '-apple-system', 'BlinkMacSystemFont', 'Segoe UI', 'Roboto', 'Helvetica Neue', 'Arial', 'Noto Sans', sans-serif;
      margin: 0;
      background: #F2EDE4; /* Warm cream - Azimuth style */
    }

    #root {
      height: 100vh;
      width: 100vw;
      display: block;
    }

    /* Initial loading indicator */
    #root:empty::before {
      content: '';
      width: 40px;
      height: 40px;
      border: 3px solid #333;
      border-top-color: #d4af37;
      border-radius: 50%;
      animation: spin 1s linear infinite;
    }

    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }
  </style>
</head>

<body class="loading">
  <div id="root"></div>
  <script type="module" src="/src/main.tsx"></script>
</body>

</html>
