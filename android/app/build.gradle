apply plugin: 'com.android.application'
apply plugin: 'org.jetbrains.kotlin.android'

android {
    namespace = "com.noorconnect.app"
    compileSdk = rootProject.ext.compileSdkVersion

    buildFeatures {
        buildConfig = true
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    
    kotlinOptions {
        jvmTarget = "17"
    }
    
    defaultConfig {
        applicationId "com.noorconnect.app"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 12
        versionName "2.4.0"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    flavorDimensions "default"
    productFlavors {
        foss {
            dimension "default"
        }
    }
}

// Task to move mushaf images from public to android assets and remove from dist to avoid duplication
task moveMushafImages {
    def sourceDir = file("${project.projectDir}/../../public/mushaf")
    def targetDir = file("${project.projectDir}/src/main/assets/public/mushaf")
    def distDir = file("${project.projectDir}/../../dist/mushaf")
    
    doLast {
        println "Source dir: ${sourceDir.absolutePath}, exists: ${sourceDir.exists()}"
        println "Target dir: ${targetDir.absolutePath}"
        println "Dist dir: ${distDir.absolutePath}, exists: ${distDir.exists()}"
        
        // Only run if source directory exists
        if (sourceDir.exists()) {
            // Create target directory if it doesn't exist
            targetDir.mkdirs()
            
            // Copy images from public/mushaf to android assets
            def copied = 0
            sourceDir.eachFile { file ->
                if (file.name.endsWith('.webp')) {
                    def targetFile = new File(targetDir, file.name)
                    targetFile.bytes = file.bytes
                    copied++
                }
            }
            println "Copied ${copied} images to ${targetDir.absolutePath}"
            
            // Remove images from dist/mushaf if it exists (to avoid duplication after Capacitor sync)
            if (distDir.exists()) {
                def deleted = 0
                distDir.eachFile { file ->
                    if (file.name.endsWith('.webp')) {
                        file.delete()
                        deleted++
                    }
                }
                println "Deleted ${deleted} images from ${distDir.absolutePath}"
                // Remove empty directory
                if (distDir.listFiles().length == 0) {
                    distDir.deleteDir()
                    println "Removed empty dist/mushaf directory"
                }
            }
            
            println "Moved mushaf images from public/mushaf to android assets and removed from dist/mushaf"
        } else {
            println "Source directory does not exist, skipping"
        }
    }
}

// Run the move task before preBuild
preBuild.dependsOn moveMushafImages

// Task to (re)generate the bundled widget hadiths JSON from public/data/hadith-collections
task buildWidgetHadiths {
    def script = file("${project.projectDir}/../../scripts/build-widget-hadiths.cjs")
    def collectionsDir = file("${project.projectDir}/../../public/data/hadith-collections")
    def outDir = file("${project.projectDir}/src/main/assets")
    def outFile = new File(outDir, "widget_hadiths.json")

    inputs.dir collectionsDir
    inputs.file script
    outputs.file outFile

    doLast {
        if (script.exists()) {
            println "Building widget hadiths bundle..."
            outDir.mkdirs()
            exec {
                executable "node"
                args script.absolutePath
            }
        } else {
            println "WARN: build-widget-hadiths.cjs not found at ${script.absolutePath}, skipping"
        }
    }
}

// Run the hadiths build before preBuild (only if assets dir is missing or stale)
preBuild.dependsOn buildWidgetHadiths

// Task to strip .gz / .br compressed variants from the synced web assets.
// vite-plugin-compression produces these for the browser, but AAPT2 rejects
// them as duplicate resources in android assets (e.g. 1.json + 1.json.gz).
task stripCompressedAssets {
    def assetsPublicDir = file("${project.projectDir}/src/main/assets/public")
    inputs.dir assetsPublicDir
    doLast {
        if (!assetsPublicDir.exists()) return
        def deleted = 0
        assetsPublicDir.eachFileRecurse { f ->
            if (f.isFile() && (f.name.endsWith('.gz') || f.name.endsWith('.br'))) {
                // Keep the gzip archives we intentionally ship for offline hadith
                // loading (dist/data/hadith-collections/**/*.json.gz), but delete
                // their plain .json twins — AAPT2 treats foo.json + foo.json.gz
                // as duplicate resources.
                if (f.name.endsWith('.json.gz') && f.path.contains('hadith-collections')) {
                    def twin = new File(f.path.replaceAll(/\.gz$/, ''))
                    if (twin.exists() && twin.delete()) {
                        deleted++
                    }
                    return
                }
                f.delete()
                deleted++
            }
        }
        if (deleted > 0) {
            println "Stripped ${deleted} compressed (.gz/.br) duplicate assets from android/assets/public"
        }
    }
}

preBuild.dependsOn stripCompressedAssets

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
        dirs '../../node_modules/@capacitor/background-runner/android/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')

    // Material Components for Material3 styles (Widget.Material3.Button, etc.)
    implementation "com.google.android.material:material:1.12.0"

    // WorkManager for periodic widget refresh
    implementation "androidx.work:work-runtime-ktx:2.9.0"

    // Coroutines for async widget operations
    implementation "org.jetbrains.kotlinx:kotlinx-coroutines-android:1.7.3"
}

apply from: 'capacitor.build.gradle'

// Removed Google Services for F-Droid compliance. All notifications are handled locally.
apply from: 'fdroid.gradle'
