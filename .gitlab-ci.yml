# GitLab CI — builds an unsigned test APK on every push to the repository.
#
# The build pipeline mirrors the F-Droid release recipe (see metadata.yml and
# BUILD-APK.md):
#   npm run build  ->  node scripts/clean-dist-data.js  ->  npx cap sync android
#   ->  ./gradlew assembleFossRelease
#
# The `foss` flavor is the F-Droid variant (fdroid.gradle excludes all GMS).
# The gradle preBuild tasks (moveMushafImages,
# stripCompressedAssets) run automatically and handle the mushaf webp dedup,
# exactly like the F-Droid build.
#
# android/app/build.gradle has NO signingConfig, so Gradle emits an UNSIGNED
# APK. It installs fine via `adb install` for testing ("is the app ready?")
# but is NOT Play-Store distributable.

stages:
  - build

variables:
  ANDROID_COMPILE_SDK: "36"
  ANDROID_BUILD_TOOLS: "36.0.0"
  ANDROID_SDK_ROOT: "$CI_PROJECT_DIR/.android-sdk"
  ANDROID_HOME: "$ANDROID_SDK_ROOT"
  GRADLE_USER_HOME: "$CI_PROJECT_DIR/.gradle-home"
  GRADLE_OPTS: "-Dorg.gradle.jvmargs=-Xmx3g -Dfile.encoding=UTF-8"

# Two caches:
#  1) npm modules + gradle caches, keyed on lockfiles (invalidated when deps change)
#  2) the Android SDK, keyed on SDK version — avoids re-downloading ~400 MB every push
cache:
  - key:
      files:
        - package-lock.json
        - android/gradle/wrapper/gradle-wrapper.properties
    paths:
      - node_modules/
      - .gradle-home/
  - key: "android-sdk-$ANDROID_COMPILE_SDK-$ANDROID_BUILD_TOOLS"
    paths:
      - .android-sdk/

build-apk:
  stage: build
  image: node:22-bookworm
  script:
    # --- Java 17 (required by AGP 8.9 / Gradle 8.11) ---
    - 'apt-get update -qq'
    - 'apt-get install -y -qq --no-install-recommends openjdk-17-jdk-headless unzip'
    - 'export JAVA_HOME=/usr/lib/jvm/java-17-openjdk-amd64'
    - 'export PATH="$JAVA_HOME/bin:$PATH"'
    # --- Android SDK command-line tools (skip download when cached) ---
    - 'mkdir -p "$ANDROID_SDK_ROOT/cmdline-tools"'
    - '[ -d "$ANDROID_SDK_ROOT/cmdline-tools/latest" ] || curl -fsSLo /tmp/cmdtools.zip https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip'
    - '[ -d "$ANDROID_SDK_ROOT/cmdline-tools/latest" ] || (unzip -q /tmp/cmdtools.zip -d "$ANDROID_SDK_ROOT/cmdline-tools" && mv "$ANDROID_SDK_ROOT/cmdline-tools/cmdline-tools" "$ANDROID_SDK_ROOT/cmdline-tools/latest")'
    - 'yes | "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" --sdk_root="$ANDROID_SDK_ROOT" --licenses > /dev/null 2>&1 || true'
    - '"$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" --sdk_root="$ANDROID_SDK_ROOT" "platforms;android-$ANDROID_COMPILE_SDK" "build-tools;$ANDROID_BUILD_TOOLS" "platform-tools"'
    # --- Web build + APK size cleanup + Capacitor sync (F-Droid order) ---
    - 'npm ci'
    - 'npm run build'
    - 'node scripts/clean-dist-data.js'
    - 'npx cap sync android'
    # --- Gradle: F-Droid (foss) release variant, unsigned ---
    - 'chmod +x android/gradlew'
    - 'cd android'
    - './gradlew assembleFossRelease --no-daemon'
    - 'cd ..'
    # --- Rename APK with version + print download links (findable in job log) ---
    - 'VERSION=$(awk -F"\"" "/\"version\"/{print \$4}" package.json)'
    - 'VERSION=${VERSION:-unknown}'
    - 'APK_PATH=$(find android/app/build/outputs -name "*.apk" -type f | head -n 1)'
    - 'mkdir -p dist-apk'
    # Android refuses to install unsigned APKs ("certificate" error), so sign
    # with a throwaway test key. This is NOT for publishing — F-Droid and
    # Google Play re-sign with their own keys when you ship.
    - 'keytool -genkeypair -v -keystore test.keystore -alias testkey -keyalg RSA -keysize 2048 -validity 10000 -storepass testtest -keypass testtest -dname "CN=Noor Connect Test,O=Noor Connect,C=US" > /dev/null 2>&1'
    - '"$ANDROID_SDK_ROOT/build-tools/$ANDROID_BUILD_TOOLS/zipalign" -p 4 "${APK_PATH}" dist-apk/aligned.apk'
    - '"$ANDROID_SDK_ROOT/build-tools/$ANDROID_BUILD_TOOLS/apksigner" sign --ks test.keystore --ks-pass pass:testtest --key-pass pass:testtest --out "dist-apk/Noor-Connect-v${VERSION}-foss.apk" dist-apk/aligned.apk'
    - 'cp "dist-apk/Noor-Connect-v${VERSION}-foss.apk" dist-apk/Noor-Connect-foss.apk'
    - 'rm -f dist-apk/aligned.apk'
    - 'echo ""'
    - 'echo "=================================================="'
    - 'echo "APK file: dist-apk/Noor-Connect-v${VERSION}-foss.apk (signed with test key)"'
    - 'echo "Latest build on $CI_DEFAULT_BRANCH: ${CI_SERVER_URL}/${CI_PROJECT_PATH}/-/jobs/artifacts/${CI_DEFAULT_BRANCH}/download?job=build-apk"'
    - 'echo "This job: ${CI_SERVER_URL}/${CI_PROJECT_PATH}/-/jobs/${CI_JOB_ID}/artifacts/download"'
    - 'echo "=================================================="'
  # Manual only: this job never runs on push — click the ▶ play button on the
  # pipeline (or Run Pipeline) whenever you want a fresh APK.
  rules:
    - when: manual
      allow_failure: false
  artifacts:
    # expose_as cannot be combined with a wildcard path, so point it at the
    # exact filename (copied above) instead of dist-apk/*.apk.
    name: "noor-connect-$CI_COMMIT_REF_SLUG-$CI_COMMIT_SHORT_SHA"
    expose_as: "apk"
    paths:
      - dist-apk/Noor-Connect-foss.apk
    expire_in: 14 days
    when: on_success
